<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* CSS Variables */
        :root {
            --toggle-height: 16px;
            --toggle-width: 30px;
            --toggle-slider-size: calc(var(--toggle-height) - 4px);
            --toggle-slider-offset: 2px;
            --toggle-slider-translate: calc(var(--toggle-width) - var(--toggle-slider-size) - calc(var(--toggle-slider-offset) * 2));
        }

        /* Base Styles */
        * {
            box-sizing: border-box;
        }

        html {
            height: 100%;
            width: 100%;
        }

        body {
            padding: 16px 12px;
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            color: var(--vscode-foreground);
            line-height: 1.5;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden;
            /* Minimum height to ensure all elements remain visible when collapsed */
            min-height: 280px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1 1 0;
            min-height: 0;
            overflow: visible;
        }

        .dev-section {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            overflow: visible;
            /* Minimum height to ensure select group and description remain visible */
            min-height: 100px;
        }

        .section-divider {
            height: 1px;
            background-color: var(--vscode-panel-border);
            margin: 12px 0;
            flex-shrink: 0;
        }

        .settings-section {
            flex: 0 0 auto;
        }

        .settings-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            padding: 0;
        }

        /* Shared Interactive States */
        .interactive {
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: all 0.1s ease;
        }

        .interactive:hover {
            opacity: 0.9;
        }

        .interactive:focus-visible {
            outline: 1px solid var(--vscode-focusBorder);
            outline-offset: 2px;
        }

        /* Shared Button Base */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-family: var(--vscode-font-family);
            transition: background-color 0.1s ease;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--vscode-button-hoverBackground);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary.loading {
            position: relative;
            color: transparent;
        }

        .btn-primary .spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            border: 2px solid var(--vscode-button-foreground);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-primary.loading .spinner {
            display: block;
        }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .btn-secondary {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            padding: 4px 10px;
            font-size: 12px;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--vscode-button-secondaryHoverBackground);
        }

        .btn-icon {
            background: transparent;
            color: var(--vscode-icon-foreground);
            padding: 4px;
            font-size: 14px;
        }

        .btn-icon:hover:not(:disabled) {
            background-color: var(--vscode-toolbar-hoverBackground);
        }

        /* Checkbox Component */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 1px solid var(--vscode-checkbox-border);
            background-color: var(--vscode-checkbox-background);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .checkbox-container:hover .checkbox {
            border-color: var(--vscode-focusBorder);
        }

        .checkbox.checked {
            border-color: var(--vscode-focusBorder);
        }

        .checkbox.checked::after {
            content: '✓';
            color: var(--vscode-checkbox-foreground);
            font-size: 13px;
            font-weight: bold;
            line-height: 1;
        }

        .checkbox-label {
            font-size: 13px;
        }

        /* Custom Select Menu with Icons */
        .select-group {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            position: relative;
            overflow: visible;
        }

        .select-wrapper {
            flex: 1;
            position: relative;
        }

        .custom-select {
            width: 100%;
            padding: 6px 12px;
            padding-right: 28px;
            background-color: var(--vscode-dropdown-background);
            border: 1px solid var(--vscode-dropdown-border);
            border-radius: 2px;
            color: var(--vscode-foreground);
            font-family: var(--vscode-font-family);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.1s ease, background-color 0.1s ease;
        }

        .custom-select:hover {
            background-color: var(--vscode-list-hoverBackground);
        }

        .custom-select:focus {
            outline: 1px solid var(--vscode-focusBorder);
            outline-offset: -1px;
        }

        .custom-select-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.15s ease-out;
            color: var(--vscode-descriptionForeground);
        }

        .custom-select-icon.show {
            opacity: 1;
        }

        .custom-select-text {
            flex: 1;
            text-align: left;
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--vscode-foreground);
            font-size: 10px;
            opacity: 0.7;
        }

        .custom-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--vscode-dropdown-background);
            border: 1px solid var(--vscode-dropdown-border);
            border-radius: 2px;
            margin-top: 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-4px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.15s ease-out, transform 0.15s ease-out;
        }

        .custom-dropdown-menu.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .custom-dropdown-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            background: transparent;
            border: none;
            color: var(--vscode-dropdown-foreground);
            text-align: left;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .custom-dropdown-item:hover {
            background-color: var(--vscode-list-hoverBackground);
        }

        .custom-dropdown-item-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: var(--vscode-descriptionForeground);
        }

        /* Info Row with Label (used for CLI status and button labels) */
        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            width: 100%;
        }

        .info-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            transition: color 0.2s ease;
            color: var(--vscode-descriptionForeground);
        }

        .info-icon.unknown {
            color: var(--vscode-descriptionForeground);
        }

        .info-icon.white {
            color: var(--vscode-descriptionForeground);
        }

        .info-icon.installed {
            color: var(--vscode-descriptionForeground);
        }

        .info-label {
            font-weight: 500;
            flex-shrink: 0;
            transition: color 0.2s ease;
        }


        .cli-status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            color: var(--vscode-descriptionForeground);
            font-size: 12px;
        }

        .settings-status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            color: var(--vscode-descriptionForeground);
            font-size: 12px;
        }

        .settings-status-right.interactive {
            cursor: pointer;
            color: var(--vscode-foreground);
        }

        .settings-status-right.interactive:hover {
            opacity: 0.9;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            width: var(--toggle-width);
            height: var(--toggle-height);
            margin-left: auto;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--vscode-checkbox-border);
            transition: 0.2s;
            border-radius: var(--toggle-height);
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: var(--toggle-slider-size);
            width: var(--toggle-slider-size);
            left: var(--toggle-slider-offset);
            bottom: var(--toggle-slider-offset);
            background-color: var(--vscode-checkbox-background);
            transition: 0.2s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--vscode-button-background);
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(var(--toggle-slider-translate));
        }

        .toggle-switch:focus-within .toggle-slider {
            outline: 1px solid var(--vscode-focusBorder);
            outline-offset: 2px;
        }

        .codicon {
            font-family: codicon;
            font-size: 16px;
            line-height: 1;
            display: inline-block;
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .ml-auto {
            margin-left: auto;
        }

        .flex-shrink-0 {
            flex-shrink: 0;
        }

        /* CMX Description */
        .cmx-description {
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            color: var(--vscode-descriptionForeground);
            margin-top: 12px;
            padding: 0 8px;
        }

        .dev-mode-description {
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            color: var(--vscode-descriptionForeground);
            margin-top: 8px;
            padding: 0 8px;
        }

        .cmx-link {
            color: var(--vscode-textLink-foreground);
            text-decoration: underline;
            cursor: pointer;
        }

        .cmx-link:hover {
            color: var(--vscode-textLink-activeForeground);
        }

        /* Login Status Row */
        .login-status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: flex-end;
            min-width: 0;
        }

        .login-action-link {
            color: var(--vscode-textLink-foreground);
            text-decoration: underline;
            cursor: pointer;
            font-size: 12px;
        }

        .login-action-link:hover {
            color: var(--vscode-textLink-activeForeground);
        }

        #loginStatusText {
            font-size: 12px;
            color: var(--vscode-descriptionForeground);
            white-space: nowrap;
        }

        #loginStatusAction {
            flex-shrink: 0;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- Dev Section -->
        <div class="dev-section">
            <div class="select-group">
                <div class="select-wrapper">
                    <button class="custom-select" id="customSelectBtn" type="button">
                        <svg class="custom-select-icon" id="selectedIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M21.46 2.172H2.54A2.548 2.548 0 0 0 0 4.712v14.575a2.548 2.548 0 0 0 2.54 2.54h18.92a2.548 2.548 0 0 0 2.54-2.54V4.713a2.548 2.548 0 0 0-2.54-2.54ZM10.14 16.465 5.524 19.15a1.235 1.235 0 1 1-1.242-2.137L8.9 14.33a1.235 1.235 0 1 1 1.241 2.136zm1.817-4.088h-.006a1.235 1.235 0 0 1-1.23-1.24l.023-5.32a1.236 1.236 0 0 1 1.236-1.23h.005a1.235 1.235 0 0 1 1.23 1.241l-.023 5.32a1.236 1.236 0 0 1-1.235 1.23zm8.17 6.32a1.235 1.235 0 0 1-1.688.453l-4.624-2.67a1.235 1.235 0 1 1 1.235-2.14l4.624 2.67a1.235 1.235 0 0 1 .452 1.688z"/>

                            <svg class="custom-dropdown-item-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M21.46 2.172H2.54A2.548 2.548 0 0 0 0 4.712v14.575a2.548 2.548 0 0 0 2.54 2.54h18.92a2.548 2.548 0 0 0 2.54-2.54V4.713a2.548 2.548 0 0 0-2.54-2.54ZM10.14 16.465 5.524 19.15a1.235 1.235 0 1 1-1.242-2.137L8.9 14.33a1.235 1.235 0 1 1 1.241 2.136zm1.817-4.088h-.006a1.235 1.235 0 0 1-1.23-1.24l.023-5.32a1.236 1.236 0 0 1 1.236-1.23h.005a1.235 1.235 0 0 1 1.23 1.241l-.023 5.32a1.236 1.236 0 0 1-1.235 1.23zm8.17 6.32a1.235 1.235 0 0 1-1.688.453l-4.624-2.67a1.235 1.235 0 1 1 1.235-2.14l4.624 2.67a1.235 1.235 0 0 1 .452 1.688z"/>

                            <span>k3s • 3 node • Ubuntu</span>

                        <button class="custom-dropdown-item" data-value="custom" data-text="Custom">

                    </div>
                </div>
                <button class="btn btn-primary" id="testEnvBtn">
                    <span class="btn-text">Go</span>
                    <span class="spinner"></span>
                </button>
            </div>

        <!-- Section Divider -->
        <div class="section-divider"></div>

        <!-- Settings Section -->
        <div class="settings-section">
            <ul class="settings-list">
                <!-- Code Sync into CMX environment -->
                <li class="settings-row">
                    <div class="info-row">
                        <svg class="info-icon" id="codeSyncIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                <!-- Auto-lint -->
                <li class="settings-row">
                    <div class="info-row">
                        <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </li>

                <!-- CLI Status -->
                <li class="settings-row">
                    <div class="info-row">
                        <svg class="info-icon unknown" id="cliIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 19h8"/>
                            <path d="m4 17 6-6-6-6"/>
                        </svg>
                        <span class="info-label">Replicated CLI</span>
                        <div class="cli-status-right">
                            <span id="cliVersion">Checking…</span>
                            <span id="cliStatus"></span>
                        </div>
                    </div>
                </li>

                <!-- Login Status -->
                <li class="settings-row">
                    <div class="info-row">
                        <svg class="info-icon unknown" id="loginStatusIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        <span class="info-label">Replicated Account</span>
                        <div class="login-status-right">
                            <span id="loginStatusText">Checking…</span>
                            <span id="loginStatusAction"></span>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // VS Code API
        const vscode = acquireVsCodeApi();

        // State
        const state = {
            codeSyncEnabled: false,
            autoLintEnabled: false,
            cliInstalled: false,
            currentVersion: null,
            latestVersion: null
        };

        // DOM Elements (cached for performance)
        const elements = {
            codeSyncToggle: document.getElementById('codeSyncToggle'),
            codeSyncIcon: document.getElementById('codeSyncIcon'),
            devModeDescription: document.getElementById('devModeDescription'),
            autoLintToggle: document.getElementById('autoLintToggle'),
            testEnvBtn: document.getElementById('testEnvBtn'),
            customSelectBtn: document.getElementById('customSelectBtn'),
            customDropdown: document.getElementById('customDropdown'),
            dropdownItems: document.querySelectorAll('.custom-dropdown-item'),
            selectedIcon: document.getElementById('selectedIcon'),
            selectedText: document.getElementById('selectedText'),
            cliIcon: document.getElementById('cliIcon'),
            cliVersion: document.getElementById('cliVersion'),
            cliStatus: document.getElementById('cliStatus'),
            loginStatusIcon: document.getElementById('loginStatusIcon'),
            loginStatusText: document.getElementById('loginStatusText'),
            loginStatusAction: document.getElementById('loginStatusAction')
        };

        // Current selected value
        let selectedValue = 'k3s-1node';

        // Utility Functions
        const postMessage = (type, data = {}) => {
            vscode.postMessage({ type, ...data });
        };

        const toggleClass = (element, className, condition) => {
            element?.classList.toggle(className, condition);
        };

        const setElementVisibility = (element, visible) => {
            toggleClass(element, 'hidden', !visible);
        };

        const formatVersion = (version) => {
            if (!version) return '';
            return version.startsWith('v') ? version : `v${version}`;
        };

        const updateCLIDisplay = (installed, version, updateAvailable, latestVer) => {
            // Update state
            state.cliInstalled = installed;
            state.currentVersion = version;
            state.latestVersion = latestVer;

            // Update icon state
            const iconClass = (installed && !updateAvailable) ? 'installed' : 'unknown';
            elements.cliIcon.className = `info-icon ${iconClass}`;

            // Version span: 3 states
            if (installed === undefined) {
                elements.cliVersion.textContent = 'Checking…';
            } else if (!installed) {
                elements.cliVersion.textContent = 'Not found';
            } else {
                elements.cliVersion.textContent = formatVersion(version);
            }

            // Status span: "(Current)" or Update button
            const statusEl = elements.cliStatus;
            statusEl.innerHTML = ''; // Clear previous content
            
            if (installed && updateAvailable && latestVer) {
                // Show update button
                const btn = document.createElement('button');
                btn.className = 'btn btn-secondary';
                btn.textContent = `Update (${formatVersion(latestVer)})`;
                btn.addEventListener('click', () => {
                    postMessage('runCLICommand', { 
                        command: 'brew upgrade replicatedhq/replicated/cli' 
                    });
                });
                statusEl.appendChild(btn);
            } else if (installed && !updateAvailable) {
                // Show "(Current)" text
                statusEl.textContent = '(Current)';
            }
            // Otherwise empty (checking or not found states)
        };

        // Login Status Feature
        const updateLoginDisplay = (loggedIn, error) => {
            const iconEl = elements.loginStatusIcon;
            const textEl = elements.loginStatusText;
            const actionEl = elements.loginStatusAction;
            
            // Clear previous action
            actionEl.innerHTML = '';
            
            if (loggedIn === undefined) {
                // Checking state
                iconEl.className = 'info-icon unknown';
                textEl.textContent = 'Checking…';
            } else if (error === 'CLI not installed') {
                // CLI not installed
                iconEl.className = 'info-icon unknown';
                textEl.textContent = 'CLI not found';
            } else if (loggedIn) {
                // Logged in
                iconEl.className = 'info-icon installed';
                textEl.textContent = 'Logged in';
                
                // Add logout link
                const logoutLink = document.createElement('a');
                logoutLink.href = '#';
                logoutLink.className = 'login-action-link';
                logoutLink.textContent = 'Logout';
                logoutLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    postMessage('logout');
                    // Show checking state
                    updateLoginDisplay(undefined);
                });
                actionEl.appendChild(logoutLink);
            } else {
                // Not logged in
                iconEl.className = 'info-icon unknown';
                textEl.textContent = 'Not logged in';
                
                // Add login button
                const loginBtn = document.createElement('button');
                loginBtn.className = 'btn btn-secondary';
                loginBtn.textContent = 'Login';
                loginBtn.addEventListener('click', () => {
                    postMessage('login');
                    // Show checking state
                    updateLoginDisplay(undefined);
                });
                actionEl.appendChild(loginBtn);
            }
        };

        // Code Sync Feature
        const toggleCodeSync = () => {
            // Update icon color immediately based on toggle state
            const isEnabled = elements.codeSyncToggle?.checked ?? false;
            if (elements.codeSyncIcon) {
                elements.codeSyncIcon.style.stroke = isEnabled ? '#51E9F0' : 'currentColor';
            }
            // Show/hide dev mode description immediately
            if (elements.devModeDescription) {
                elements.devModeDescription.style.display = isEnabled ? 'block' : 'none';
            }
            postMessage('toggleCodeSync');
        };

        const updateCodeSyncUI = (enabled) => {
            state.codeSyncEnabled = enabled;
            if (elements.codeSyncToggle) {
                elements.codeSyncToggle.checked = enabled;
            }
            // Update icon color to cyberMint when enabled
            if (elements.codeSyncIcon) {
                elements.codeSyncIcon.style.stroke = enabled ? '#51E9F0' : 'currentColor';
            }
            // Show/hide dev mode description
            if (elements.devModeDescription) {
                elements.devModeDescription.style.display = enabled ? 'block' : 'none';
            }
        };

        // Auto-lint Feature
        const toggleAutoLint = () => {
            postMessage('toggleAutoLint');
        };

        const updateAutoLintUI = (enabled) => {
            state.autoLintEnabled = enabled;
            if (elements.autoLintToggle) {
                elements.autoLintToggle.checked = enabled;
            }
        };

        // Test in Environment Feature
        const testInEnvironment = () => {
            const btn = elements.testEnvBtn;
            const btnText = btn?.querySelector('.btn-text');
            
            // Disable button and show spinner
            if (btn) {
                btn.disabled = true;
                btn.classList.add('loading');
                if (btnText) {
                    btnText.textContent = 'Provisioning...';
                }
            }
            
            // Send message to provision environment
            postMessage('testInEnvironment', { environment: selectedValue });
            
            // Re-enable button after 3 seconds (simulating cluster provisioning)
            setTimeout(() => {
                if (btn) {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    if (btnText) {
                        btnText.textContent = 'Go';
                    }
                }
            }, 3000);
        };

        const toggleDropdown = () => {
            toggleClass(elements.customDropdown, 'show');
        };

        const hideDropdown = () => {
            elements.customDropdown?.classList.remove('show');
        };

        const selectOption = (value, text, hasIcon) => {
            selectedValue = value;
            elements.selectedText.textContent = text;
            toggleClass(elements.selectedIcon, 'show', hasIcon);
            hideDropdown();
        };

        const updateSelectedDisplay = () => {
            const isK3s = selectedValue.startsWith('k3s-');
            toggleClass(elements.selectedIcon, 'show', isK3s);
        };


        // Event Listeners Setup
        const setupEventListeners = () => {
            // Code Sync toggle
            elements.codeSyncToggle?.addEventListener('change', toggleCodeSync);

            // Auto-lint toggle
            elements.autoLintToggle?.addEventListener('change', toggleAutoLint);

            // Custom select dropdown
            elements.customSelectBtn?.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleDropdown();
            });

            elements.dropdownItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const value = item.dataset.value;
                    const text = item.dataset.text;
                    const hasIcon = item.querySelector('svg') !== null;
                    selectOption(value, text, hasIcon);
                });
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.select-wrapper') && elements.customDropdown?.classList.contains('show')) {
                    hideDropdown();
                }
            });

            // Test environment button
            elements.testEnvBtn?.addEventListener('click', testInEnvironment);

            // Keyboard navigation
            elements.customSelectBtn?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleDropdown();
                }
            });

            // Initialize selected display
            updateSelectedDisplay();

            // CMX Learn More link
            const cmxLearnMoreLink = document.getElementById('cmxLearnMoreLink');
            if (cmxLearnMoreLink) {
                cmxLearnMoreLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    postMessage('openExternal', { url: 'https://docs.replicated.com/vendor/testing-about' });
                });
            }

            // Message handler from extension
            window.addEventListener('message', handleMessage);
        };

        // Message Handler
        const handleMessage = (event) => {
            const { type, enabled, installed, version, updateAvailable, latestVersion, loggedIn, error } = event.data;

            switch (type) {
                case 'updateCodeSync':
                    updateCodeSyncUI(enabled);
                    break;
                case 'updateAutoLint':
                    updateAutoLintUI(enabled);
                    break;
                case 'updateCLI':
                    updateCLIDisplay(installed, version, updateAvailable, latestVersion);
                    break;
                case 'updateLogin':
                    updateLoginDisplay(loggedIn, error);
                    break;
            }
        };

        // Initialize
        setupEventListeners();
        
        // Initialize icon color and dev mode description based on initial toggle state
        if (elements.codeSyncToggle) {
            const isEnabled = elements.codeSyncToggle.checked;
            if (elements.codeSyncIcon) {
                elements.codeSyncIcon.style.stroke = isEnabled ? '#51E9F0' : 'currentColor';
            }
            if (elements.devModeDescription) {
                elements.devModeDescription.style.display = isEnabled ? 'block' : 'none';
            }
        }
    </script>
</body>
</html>
